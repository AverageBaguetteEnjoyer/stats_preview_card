<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Stats preview card | solution to the Frontend Mentor challenge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stats preview card</title>
    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lexend+Deca&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <main>
        <article class="card">
            <div class="card__main">
                <header class="card__intro">
                    <h1>Get <span>insights</span> that help your business grow.</h1>
                    <p>Discover the benefits of data analytics and make better decisions regarding revenue, customer experience, and overall efficiency.</p>
                </header>
                <div class="card__stats">
                    <div class="card__stats-item">
                        <span>10k+</span>
                        <span>companies</span>
                    </div>
                    <div class="card__stats-item">
                        <span>314</span>
                        <span>templates</span>
                    </div>
                    <div class="card__stats-item">
                        <span>12M+</span>
                        <span>queries</span>
                    </div>
                </div>
            </div>
            <picture class="card__illustration">
                <source srcset="./images/image-header-mobile.jpg" media="(max-width: 26.25rem)">
                <img src="./images/image-header-desktop.jpg" alt="">
            </picture>
        </article>
    </main>
</body>
</html>
